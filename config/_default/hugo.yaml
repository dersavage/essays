## SITE
baseURL: https://dersavage.github.io/essays/
defaultContentLanguage: en

## ADVANCED
build:
  buildStats:
    disableClasses: false
    disableIDs: true
    disableTags: false
    enable: true
enableRobotsTXT: true
imaging:
  jpeg:
    quality: 75
  webp:
    quality: 75
markup:
  goldmark:
    renderer:
      hardWraps: true
      # the essay bodies are hand-written HTML, so let Hugo pass it through
      unsafe: true
  tableOfContents:
    ordered: true
pagination:
  pagerSize: 9
removePathAccents: true
timeout: 100000
